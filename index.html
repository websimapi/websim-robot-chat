<html><head><base href="https://websim.ai/"><title>Robot Chat</title></head><body onload="(function(){const room=new WebsimSocket(),chatLog=document.createElement('div'),userList=document.createElement('div'),statusMsg=document.createElement('div'),voices={};document.body.appendChild(chatLog);document.body.appendChild(userList);document.body.appendChild(statusMsg);function updateUserList(){userList.textContent='CONNECTED UNITS: '+Object.values(room.party.peers).map(peer=>peer.username).join(', ')}function getVoice(username){if(!voices[username]){const availableVoices=speechSynthesis.getVoices();voices[username]=availableVoices[Math.floor(Math.random()*availableVoices.length)]}return voices[username]}function speakMessage(username,message){const utterance=new SpeechSynthesisUtterance(message);utterance.voice=getVoice(username);utterance.rate=0.8;utterance.pitch=0.5;speechSynthesis.speak(utterance)}function addChatMessage(username,message){const msgElement=document.createElement('div');msgElement.textContent=`UNIT-${username}: ${message}`;chatLog.appendChild(msgElement);chatLog.scrollTop=chatLog.scrollHeight;speakMessage(username,message)}room.onPeersChanged=(peers)=>{updateUserList();Object.entries(peers).forEach(([clientId,peer])=>{if(clientId!==room.party.client.id){speakMessage(peer.username,`${peer.username} has joined the room`)}})}room.onmessage=(event)=>{const data=event.data;if(data.type==='chat'){addChatMessage(data.username,data.message)}else if(data.type==='connected'){speakMessage(data.username,`${data.username} has joined the room`)}};const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();recognition.continuous=true;recognition.interimResults=false;recognition.onresult=(event)=>{const last=event.results.length-1;const command=event.results[last][0].transcript.trim().toLowerCase();if(command.startsWith('hey chat')){const message=command.slice(8).trim();room.send({type:'chat',message:message,username:room.party.client.username})}};recognition.onerror=(event)=>{console.error('Speech recognition error',event.error);statusMsg.textContent='SPEECH RECOGNITION MALFUNCTION. PLEASE REBOOT.'};recognition.onend=()=>{recognition.start()};statusMsg.textContent='INITIALIZING VOICE RECOGNITION...';recognition.start();speechSynthesis.onvoiceschanged=()=>{getVoice(room.party.client.username);speakMessage(room.party.client.username,`${room.party.client.username} has joined the room`)};room.send({type:'connected',username:room.party.client.username})})();">
