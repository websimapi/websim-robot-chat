<html><head><base href="https://websim.ai/"><title>Robot Chat</title></head><body onload="(function(){var room=new WebsimSocket();var chatLog=document.createElement('div');var userList=document.createElement('div');var statusMsg=document.createElement('div');var voices={};document.body.appendChild(chatLog);document.body.appendChild(userList);document.body.appendChild(statusMsg);function updateUserList(){userList.textContent='CONNECTED UNITS: '+Object.values(room.party.peers).map(function(peer){return peer.username}).join(', ')}function getVoice(username){if(!voices[username]){var availableVoices=speechSynthesis.getVoices();voices[username]=availableVoices[Math.floor(Math.random()*availableVoices.length)]}return voices[username]}function speakMessage(username,message){var utterance=new SpeechSynthesisUtterance(message);utterance.voice=getVoice(username);utterance.rate=0.8;utterance.pitch=0.5;speechSynthesis.speak(utterance)}function addChatMessage(username,message){var msgElement=document.createElement('div');msgElement.textContent='UNIT-'+username+': '+message;chatLog.appendChild(msgElement);chatLog.scrollTop=chatLog.scrollHeight;speakMessage(username,message)}room.onPeersChanged=function(peers){updateUserList();Object.entries(peers).forEach(function(entry){var clientId=entry[0];var peer=entry[1];if(clientId!==room.party.client.id){speakMessage(peer.username,peer.username+' has joined the room')}})}room.onmessage=function(event){var data=event.data;if(data.type==='chat'){addChatMessage(data.username,data.message)}else if(data.type==='connected'){speakMessage(data.username,data.username+' has joined the room')}};var recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();recognition.continuous=true;recognition.interimResults=false;recognition.onresult=function(event){var last=event.results.length-1;var command=event.results[last][0].transcript.trim().toLowerCase();if(command.startsWith('hey chat')){var message=command.slice(8).trim();room.send({type:'chat',message:message,username:room.party.client.username})}};recognition.onerror=function(event){console.error('Speech recognition error',event.error);statusMsg.textContent='SPEECH RECOGNITION MALFUNCTION. PLEASE REBOOT.'};recognition.onend=function(){recognition.start()};statusMsg.textContent='INITIALIZING VOICE RECOGNITION...';recognition.start();speechSynthesis.onvoiceschanged=function(){getVoice(room.party.client.username);speakMessage(room.party.client.username,room.party.client.username+' has joined the room')};room.send({type:'connected',username:room.party.client.username})})();">
