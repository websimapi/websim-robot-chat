<html><head><base href="https://websim.ai/"><title>Robot Chat</title></head><body onload="const room=new WebsimSocket(),chatLog=document.createElement('div'),userList=document.createElement('div'),statusMsg=document.createElement('div');document.body.appendChild(chatLog);document.body.appendChild(userList);document.body.appendChild(statusMsg);function updateUserList(){userList.textContent='CONNECTED UNITS: '+Object.values(room.party.peers).map(peer=>peer.username).join(', ')}function addChatMessage(username,message){const msgElement=document.createElement('div');msgElement.textContent=`UNIT-${username}: ${message}`;chatLog.appendChild(msgElement);chatLog.scrollTop=chatLog.scrollHeight;const utterance=new SpeechSynthesisUtterance(message);utterance.rate=0.8;utterance.pitch=0.5;speechSynthesis.speak(utterance)}room.onPeersChanged=updateUserList;room.onmessage=(event)=>{const data=event.data;if(data.type==='chat'){addChatMessage(data.username,data.message)}};const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();recognition.continuous=true;recognition.interimResults=false;recognition.onresult=(event)=>{const last=event.results.length-1;const command=event.results[last][0].transcript.trim().toLowerCase();if(command.startsWith('hey chat')){const message=command.slice(8).trim();room.send({type:'chat',message:message})}};recognition.onerror=(event)=>{console.error('Speech recognition error',event.error);statusMsg.textContent='SPEECH RECOGNITION MALFUNCTION. PLEASE REBOOT.'};recognition.onend=()=>{recognition.start()};statusMsg.textContent='INITIALIZING VOICE RECOGNITION...';recognition.start();">
